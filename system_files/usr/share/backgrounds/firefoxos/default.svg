<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <!-- "Meadow": rolling green hills under a blue sky (original artwork) -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f5fd1"/>
      <stop offset="0.45" stop-color="#4f93ea"/>
      <stop offset="0.75" stop-color="#9cc9f5"/>
      <stop offset="1" stop-color="#d4ebff"/>
    </linearGradient>
    <linearGradient id="hill1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ed04b"/>
      <stop offset="0.5" stop-color="#4fa82a"/>
      <stop offset="1" stop-color="#2f7d18"/>
    </linearGradient>
    <linearGradient id="hill2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fb83a"/>
      <stop offset="1" stop-color="#256a12"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#sky)"/>
  <circle cx="1480" cy="210" r="260" fill="url(#sun)"/>
  <g fill="#ffffff" opacity="0.85" filter="url(#blur)">
    <ellipse cx="380" cy="220" rx="240" ry="55"/>
    <ellipse cx="520" cy="190" rx="160" ry="45"/>
    <ellipse cx="1100" cy="320" rx="300" ry="50"/>
    <ellipse cx="1650" cy="430" rx="220" ry="40"/>
    <ellipse cx="760" cy="420" rx="180" ry="32"/>
  </g>
  <path d="M0 760 C300 690 520 700 760 740 C1000 780 1250 720 1500 690 C1700 668 1840 690 1920 705 V1080 H0 Z" fill="url(#hill2)" opacity="0.9"/>
  <path d="M0 860 C260 700 700 600 1060 640 C1380 676 1660 800 1920 760 V1080 H0 Z" fill="url(#hill1)"/>
  <path d="M0 860 C260 700 700 600 1060 640 C1380 676 1660 800 1920 760" fill="none" stroke="#a8e57a" stroke-width="6" opacity="0.5"/>
</svg>
