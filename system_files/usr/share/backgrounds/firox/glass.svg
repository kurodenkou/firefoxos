<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <!-- "Glass": indigo to rose with soft colour fields and light ribbons,
       for the Glass look to show through (original artwork; gradients only,
       no filters, so every SVG renderer draws it the same) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14205e"/>
      <stop offset="0.45" stop-color="#4b2a8f"/>
      <stop offset="0.8" stop-color="#b8407e"/>
      <stop offset="1" stop-color="#f08a5d"/>
    </linearGradient>
    <radialGradient id="cyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3fd4ff" stop-opacity="0.85"/>
      <stop offset="0.55" stop-color="#3fd4ff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#3fd4ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pink" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff5fb4" stop-opacity="0.8"/>
      <stop offset="0.6" stop-color="#ff5fb4" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#ff5fb4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amber" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffc35a" stop-opacity="0.9"/>
      <stop offset="0.6" stop-color="#ffc35a" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffc35a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8f6bff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#8f6bff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.7" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ribbon2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#bfe9ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#bfe9ff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffd6ec" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <ellipse cx="330" cy="260" rx="760" ry="560" fill="url(#cyan)"/>
  <ellipse cx="1500" cy="330" rx="700" ry="520" fill="url(#violet)"/>
  <ellipse cx="1180" cy="760" rx="760" ry="520" fill="url(#pink)"/>
  <ellipse cx="1780" cy="1040" rx="620" ry="420" fill="url(#amber)"/>
  <ellipse cx="420" cy="980" rx="620" ry="380" fill="url(#violet)"/>
  <path d="M-80 720 C 380 520, 760 900, 1180 640 S 1760 420, 2000 560"
        fill="none" stroke="url(#ribbon)" stroke-width="90" stroke-linecap="round"/>
  <path d="M-60 820 C 420 640, 820 1000, 1240 760 S 1780 560, 1990 700"
        fill="none" stroke="url(#ribbon2)" stroke-width="34" stroke-linecap="round"/>
  <path d="M200 140 C 600 40, 980 260, 1380 150 S 1840 60, 2000 120"
        fill="none" stroke="url(#ribbon)" stroke-width="22" stroke-linecap="round" opacity="0.6"/>
  <circle cx="1560" cy="250" r="120" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>
  <circle cx="1640" cy="330" r="46" fill="#ffffff" fill-opacity="0.10" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1.5"/>
  <circle cx="300" cy="620" r="70" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.5"/>
</svg>
