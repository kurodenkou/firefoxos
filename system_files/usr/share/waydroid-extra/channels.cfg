# Waydroid image download channels.
# Fedora's waydroid package ships with these blank, so `waydroid init` and the
# "Waydroid" first-launch window would ask for OTA URLs. Firox Linux points them
# at the official Waydroid (LineageOS-based) images.
[channels]
system_channel = https://ota.waydro.id/system
vendor_channel = https://ota.waydro.id/vendor
rom_type = lineage
system_type = VANILLA
