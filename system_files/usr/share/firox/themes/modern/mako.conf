font=Noto Sans 10
background-color=#2b2b2be6
text-color=#e8e8e8
border-color=#4a4a4a
border-size=1
border-radius=8
padding=12
margin=8
width=340
icons=1
max-icon-size=32
icon-path=/usr/share/icons/Papirus-Dark
anchor=bottom-right
default-timeout=8000
layer=overlay

[urgency=critical]
border-color=#a0a0a0
default-timeout=0

# Do Not Disturb (bell in the notification area, firox-notifications): keep
# notifications in the history but don't pop them up, except urgent ones
[mode=do-not-disturb]
invisible=1

[mode=do-not-disturb urgency=critical]
invisible=0

# No pop-ups over the screen saver
[mode=screensaver]
invisible=1
