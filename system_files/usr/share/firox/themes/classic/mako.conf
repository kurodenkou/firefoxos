# XP-style "balloon tip" notifications, bottom-right above the taskbar
font=Tahoma, DejaVu Sans 10
background-color=#ffffe1
text-color=#000000
border-color=#000000
border-size=1
border-radius=8
padding=10
margin=8
width=340
icons=1
max-icon-size=32
icon-path=/usr/share/icons/Papirus
anchor=bottom-right
default-timeout=8000
layer=overlay

[urgency=critical]
border-color=#c4381a
default-timeout=0

# Do Not Disturb (bell in the notification area, firox-notifications): keep
# notifications in the history but don't pop them up, except urgent ones
[mode=do-not-disturb]
invisible=1

[mode=do-not-disturb urgency=critical]
invisible=0

# No pop-ups over the screen saver
[mode=screensaver]
invisible=1

# Volume / brightness popup (firox-osd): bottom-centre with a level bar,
# shown even with Do Not Disturb or the screen saver
[app-name=firox-osd]
anchor=bottom-center
width=260
background-color=#ffffffee
progress-color=over #8fb5f8
format=<b>%s</b>
default-timeout=1500
history=0

[mode=do-not-disturb app-name=firox-osd]
invisible=0

[mode=screensaver app-name=firox-osd]
invisible=0
