# Firox Linux power-saving defaults (minutes; 0 = never).
# Users change theirs in Settings > Power Options, which writes
# ~/.config/firox/power.conf (`firox-power` on the command line).
MONITOR_AC=15
MONITOR_BATTERY=5
LOCK=10
SLEEP_AC=0
SLEEP_BATTERY=30
LOCK_ON_WAKE=1
# Minutes before the screen saver starts (which one: Settings > Screen
# Saver, or /etc/firox/screensaver for everyone; none by default)
SCREENSAVER_WAIT=5
# Battery warnings (percent; 0 = off). At BATTERY_ACTION the computer does
# BATTERY_ACTION_KIND: 0 nothing, 1 sleep, 2 hibernate (falls back to sleep),
# 3 shut down
BATTERY_LOW=10
BATTERY_CRITICAL=5
BATTERY_ACTION=3
BATTERY_ACTION_KIND=1
