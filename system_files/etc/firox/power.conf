# Firox Linux power-saving defaults (minutes; 0 = never).
# Users change theirs in Settings > Power Options, which writes
# ~/.config/firox/power.conf (`firox-power` on the command line).
MONITOR_AC=15
MONITOR_BATTERY=5
LOCK=10
SLEEP_AC=0
SLEEP_BATTERY=30
LOCK_ON_WAKE=1
# Minutes before the screen saver starts (which one: Settings > Screen
# Saver, or /etc/firox/screensaver for everyone; none by default)
SCREENSAVER_WAIT=5
