# Firox Linux mouse, touchpad and keyboard defaults. Users change theirs in
# Settings > Mouse / Keyboard, which writes ~/.config/firox/input.conf
# (`firox-input` on the command line lists every setting).
MOUSE_SPEED=0
MOUSE_ACCEL=1
MOUSE_NATURAL=0
LEFT_HANDED=0
DOUBLE_CLICK=500
SCROLL_SPEED=1
CURSOR_SIZE=24
TOUCHPAD_TAP=1
TOUCHPAD_NATURAL=0
TOUCHPAD_SPEED=0
TOUCHPAD_DWT=1
TOUCHPAD_SCROLL=twofinger
TOUCHPAD_CLICK=auto
TOUCHPAD_OFF_WITH_MOUSE=0
# Keyboard layouts, e.g. KB_LAYOUTS=us,de (empty: the layout chosen when
# installing, from /etc/X11/xorg.conf.d/00-keyboard.conf)
KB_LAYOUTS=
KB_VARIANTS=
KB_SWITCH=grp:alt_shift_toggle
REPEAT_DELAY=600
REPEAT_RATE=25
NUMLOCK=0
