# Firox Linux clipboard defaults. Users change theirs in Settings > Clipboard,
# which writes ~/.config/firox/clipboard.conf (`firox-clipboard` on the
# command line).
# Remember recently copied items (Super+V); 0 keeps only the last one
HISTORY=1
# How many items to remember
MAX_ITEMS=100
# Keep the history after logging out or restarting (otherwise it's cleared)
KEEP_AFTER_RESTART=0
