# "Command Prompt" look
font=monospace:size=11
pad=4x4

[colors-dark]
background=000000
foreground=c0c0c0

[key-bindings]
# Ctrl+Shift+C / Ctrl+Shift+V (Ctrl+C stops a program in a terminal), plus
# the classic Ctrl+Insert / Shift+Insert
clipboard-copy=Control+Shift+c Control+Insert XF86Copy
clipboard-paste=Control+Shift+v Shift+Insert XF86Paste
primary-paste=none
