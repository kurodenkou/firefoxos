# Anaconda installer ISO.
# Firox Linux has no GNOME/KDE initial-setup wizard, so the installer itself
# creates the first user, sets the timezone and configures the network.
[customizations.installer.kickstart]
contents = """
%post
# Point updates at the published image this ISO was built from: the
# standard image or the NVIDIA one (the image records which in
# /usr/share/firox/image-ref; images built before that file existed are
# recognised by their NVIDIA driver packages).
ref="$(cat /usr/share/firox/image-ref 2>/dev/null)"
if [ -z "$ref" ]; then
    if rpm -qa 'kmod-nvidia*' 'nvidia-driver*' | grep -q .; then
        ref=ghcr.io/kurodenkou/firox-nvidia-open:latest
    else
        ref=ghcr.io/kurodenkou/firox:latest
    fi
fi
bootc switch --mutate-in-place --transport registry "$ref"
%end
"""

[customizations.installer.modules]
enable = [
  "org.fedoraproject.Anaconda.Modules.Storage",
  "org.fedoraproject.Anaconda.Modules.Runtime",
  "org.fedoraproject.Anaconda.Modules.Network",
  "org.fedoraproject.Anaconda.Modules.Security",
  "org.fedoraproject.Anaconda.Modules.Users",
  "org.fedoraproject.Anaconda.Modules.Timezone"
]
disable = [
  "org.fedoraproject.Anaconda.Modules.Services",
  "org.fedoraproject.Anaconda.Modules.Subscription"
]
